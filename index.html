<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDTERM EXAM</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #333;
        }

        .tc {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1000px;
            background-color: #ffffff;
            border: 2px solid #444;
        }

        td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        .mi {
            background-color: #e0f7fa;
        }

        .c {
            font-weight: bold;
            color: #0077b6;
        }

        table img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
    </style>
</head>
<body>

<h2>TABLE</h2>

<div class="tc">
    <table>
        <tr>
            <td colspan="5" class="mi">
                <img src="diamond.jpg" width="400" height="400" alt="Diamond">
            </td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td class="c">N37.204</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td><img src="slow.jpg" alt="Slow"></td>
            <td><img src="warn.jpg" alt="Warning"></td>
            <td><img src="ran.png" alt="Road Conjunction"></td>
            <td><img src="im.png" alt="Traffic Light"></td>
            <td><img src="!.jpg" alt="Alert"></td>
        </tr>
        <tr>
            <td>Slow</td>
            <td>Warning</td>
            <td>Road Conjunction</td>
            <td>Traffic Light</td>
            <td>Alert</td>
        </tr>
        <tr>
            <td><img src="church.png" alt="Church Ahead"></td>
            <td><img src="cross.png" alt="Cross"></td>
            <td><img src="caution.png" alt="Caution"></td>
            <td><img src="blind.png" alt="Blind Drive"></td>
            <td><img src="arrow.jpg" alt="Arrow"></td>
        </tr>
        <tr>
            <td>Church Ahead</td>
            <td>Cross</td>
            <td>Caution</td>
            <td>Blind Drive</td>
            <td>Arrow</td>
        </tr>
    </table>
</div>

</body>
</html>
